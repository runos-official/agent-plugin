name: Leak gate

# This is the gate that stands between a commit and GitHub. It runs on EVERY
# push and EVERY pull request, on every branch, and nobody can skip it.
#
# WHY IT IS ITS OWN FILE AND NOT A JOB IN THE SCHEMA WORKFLOW
# Keeping it separate keeps its trigger unconditional. A leak gate that shares
# a file with another job inherits that job's branch filters and path filters,
# and a filtered leak gate gates nothing. This workflow therefore takes no
# branch filter and no path filter at all.
#
# WHAT THIS GATE DOES NOT COVER
# leakcheck reads a file as UTF-8 and returns None for NUL-bearing or non-UTF-8
# content, then continues with no report. A credential in a binary or UTF-16
# file therefore passes it with exit 0, proved end to end in this repo. The
# scannability step below closes that here; the underlying gap is filed against
# the RunOS CLI repo, which owns the shared checker.
#
# WHY THE PRE-COMMIT HOOK IS NOT ENOUGH
# .githooks/pre-commit is opt-in per clone (`make hooks`) and skippable with
# --no-verify, and a fresh clone has core.hooksPath unset, so it has no hook at
# all. This workflow is the only run point that sees the content before a human
# does. release.yml runs `make check` too, but a release is the moment content
# becomes public, so that run point reports on a tag rather than guarding one.
#
# MODE: the whole-tree scan, the authoritative one. It reads the checked-out
# working tree plus `git ls-files`, so the default fetch-depth of 1 is enough
# and no extra history is needed.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leakcheck:
    name: Leak gate (public repo, whole tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Report the checker version
        run: python3 scripts/leakcheck.py --version

      # Fails on any credential shape, and on any internal identifier that is
      # not already recorded in scripts/leakcheck.baseline.
      - name: Scan every tracked file
        run: python3 scripts/leakcheck.py

      # leakcheck silently skips any file it cannot decode as UTF-8, so a
      # credential in a binary or UTF-16 file passes the scan above with exit
      # 0. This makes an unreadable tracked file a hard failure instead.
      - name: Every tracked file must be one leakcheck can read
        run: python3 scripts/unscannable_check.py

      # The checker's own tests: what it must catch and what it must not.
      - name: Test the checker itself
        run: python3 scripts/leakcheck_test.py
